<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoAnime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23FF7849'/%3E%3Cpath d='M9 6.5v11l9-5.5z' fill='%231A0D06'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Principal">
    <a class="brand" href="#/">
      <span class="brand-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
      <span class="brand-name">GoAnime</span>
    </a>
    <div class="nav-links">
      <a class="nav-link" href="#/" data-route="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></a>
      <a class="nav-link" href="#/search" data-route="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Buscar</span></a>
      <a class="nav-link" href="#/favorites" data-route="favorites"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"/></svg><span>Favoritos</span></a>
      <a class="nav-link" href="#/downloads" data-route="downloads"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg><span>Downloads</span><span class="badge" id="dl-badge" hidden></span></a>
    </div>
    <div class="player-card" id="player-card" aria-live="polite">
      <span class="player-label">Player</span>
      <span class="player-state"><span class="dot" id="player-dot"></span><span id="player-text">mpv pronto</span></span>
      <div class="player-bar" id="player-bar" hidden><div id="player-fill"></div></div>
      <div class="sub-row">
        <label for="sub-select" class="player-label">Legenda</label>
        <select id="sub-select" class="sub-select" aria-label="Legenda"></select>
      </div>
      <span class="sub-hint" id="sub-hint" hidden></span>
    </div>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
